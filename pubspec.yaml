name: converge
description: "Converge at the same word"
publish_to: 'none'
version: 0.3.0+6

environment:
  sdk: '>=3.4.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  web_socket_channel: ^3.0.0
  firebase_core: ^3.3.0
  firebase_analytics: ^11.2.1
  url_launcher: ^6.3.0
  confetti: ^0.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: "^0.13.1"

flutter_launcher_icons:
  image_path: assets/icon.png
  android: "launcher_icon"
  adaptive_icon_background: "#fff9eb"
  adaptive_icon_foreground: assets/icon.png
  web:
    generate: true
    background_color: "#fff9eb"

flutter:
  uses-material-design: true
